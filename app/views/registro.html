<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Registrar</title>
    <link href="styles.css" rel="stylesheet" type="text/css" />
    <style>
      /* Estilos generales */
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background: url("fondoBorroso.jpg") no-repeat center center; /* Ajuste del fondo */
        background-size: cover; /* Ajusta la imagen de fondo para que cubra toda la pantalla */
        color: #f2efef; /* Color del texto */
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      /* Botones */
      .login-btn {
        background-color: green; /* Color de fondo del botón */
        color: white; /* Color del texto */
        border: none;
        padding: 10px 20px;
        margin: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold; /* Texto en negrita */
      }

      .login-btn:hover {
        background-color: darkgreen; /* Color de fondo cuando se pasa el mouse */
      }

      /* Opciones adicionales */
      .other-options {
        text-align: center;
        margin-top: 20px;
      }

      .option-text {
        text-decoration: none;
        font-weight: bold; /* Texto en negrita */
      }
    </style>
  </head>

  <body>
    <div class="mobile-screen">
      <div class="header">
        <h1 style="color: black">Registrar</h1>
      </div>

      <div style="text-align: center">
        <img
          src="user_avatar.png"
          alt="Avatar de Usuario"
          class="avatar"
          width="120px"
          height="70px"
        />
      </div>

      <form id="registration-form" method="post" action="registro.php">
        <input type="email" name="correo" placeholder="Correo" required />
        <input type="text" name="nombre" placeholder="Nombre" required />
        <input
          type="text"
          name="apellido_paterno"
          placeholder="Apellido Paterno"
          required
        />
        <input
          type="text"
          name="apellido_materno"
          placeholder="Apellido Materno"
          required
        />
        <input
          type="text"
          name="telefono"
          placeholder="Número de teléfono"
          required
        />
        <input
          type="password"
          name="contrasena"
          placeholder="Contraseña"
          required
        />
        <input
          type="password"
          name="repass"
          placeholder="Repetir contraseña"
          required
        />
        <button
          type="submit"
          class="login-btn"
          id="signup-btn"
          style="background-color: lightslategrey; color: black"
        >
          Registrarse
        </button>
      </form>

      <div class="other-options">
        <div class="option" id="newUser">
          <a href="index.html" class="option-text" style="color: black">
            Iniciar Sesión
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
