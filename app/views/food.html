<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comida - Restaurante-Bar El Arca</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
      :root{ --primary:#007bff; --primary-dark:#0056b3; --bg-soft: rgba(255,255,255,0.92); --text-dark:#0b1a2b; }
      body{ font-family: Arial, sans-serif; margin:0; padding:0; background: url('/assets/images/fondoBorroso.jpg') center/cover no-repeat; color:#f2efef; }
      .container{ max-width:1200px; margin:0 auto; padding:20px; }
      .menu{ background: linear-gradient(90deg,#071428,#0b1a2b); color:#fff; text-align:center; padding:10px 0; width:100%; position:fixed; top:0; z-index:20; }
      .menu a{ color:#fff; text-decoration:none; margin:0 14px; font-size:16px; }
      h1{ text-align:center; margin-top:80px; }
      .product-list{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
      .product{ background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.35)); margin:10px; padding:20px; border-radius:10px; width:200px; text-align:center; transition:transform .25s ease, box-shadow .2s; cursor:pointer; }
      .product:hover{ transform:translateY(-6px); box-shadow:0 8px 24px rgba(3,12,30,0.25); }
      .modal{ display:none; position:fixed; inset:0; background: rgba(0,0,0,0.45); align-items:center; justify-content:center; }
      .modal-content{ background: linear-gradient(135deg,var(--bg-soft), rgba(240,246,255,0.86)); backdrop-filter: blur(8px); margin:0 16px; padding:18px; border-radius:12px; width:90%; max-width:520px; text-align:center; color:var(--text-dark); }
      .close{ color:#222; font-size:28px; font-weight:bold; float:right; cursor:pointer; }
    </style>
</head>
<body>
    <div class="menu">
        <a href="/?view=home">Inicio</a>
        <a href="/?view=menu">Menú</a>
        <a href="/?view=reservaciones">Reservaciones</a>
        <a href="/?view=perfil">
            <img src="/assets/images/user.png" alt="Avatar de Usuario" class="avatar" width="30px" height="30px">
        </a>
        <a href="/?view=cerrar_sesion">
            <img src="/assets/images/logout.png" alt="Cerrar sesión" class="cerrar" width="30px" height="30px">
        </a>
    </div>

    <div class="container">
        <h1>Comida</h1>
        <div class="product-list">
            <div class="product" data-name="Ensalada de Mariscos" data-price="$99" data-desc="Camarón y/o Pulpo." data-img="/assets/images/ensalada.png">
                <h2>Ensalada de Mariscos</h2>
                <p>$99</p>
                <p>Camarón y/o Pulpo.</p>
            </div>
            <div class="product" data-name="Gringa" data-price="$55" data-desc="Descripción del producto." data-img="/assets/images/gringas.png">
                <h2>Gringa</h2>
                <p>$55</p>
                <p>Descripción del producto.</p>
            </div>
            <div class="product" data-name="Club Sandwich" data-price="$110" data-desc="Descripción del producto." data-img="/assets/images/sand.png">
                <h2>Club Sandwich</h2>
                <p>$110</p>
                <p>Descripción del producto.</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalName"></h2>
            <img id="modalImg" src="" alt="Imagen del producto">
            <p id="modalDesc"></p>
            <p id="modalPrice"></p>
        </div>
    </div>

    <script>
        const products = document.querySelectorAll('.product');

        products.forEach(item => {
            item.addEventListener('click', () => {
                document.getElementById('modalName').innerText = item.getAttribute('data-name');
                document.getElementById('modalImg').src = item.getAttribute('data-img');
                document.getElementById('modalDesc').innerText = item.getAttribute('data-desc');
                document.getElementById('modalPrice').innerText = item.getAttribute('data-price');
                document.getElementById('myModal').style.display = 'block';
            });
        });

        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('myModal').style.display = 'none';
        });

        window.onclick = function(event) {
            if (event.target == document.getElementById('myModal')) {
                document.getElementById('myModal').style.display = 'none';
            }
        }
    </script>
</body>
</html>
