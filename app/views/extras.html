<link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        body {
            font-family: "Arial", sans-serif;
            background: url("fondoBorroso.jpg") no-repeat center center;
            background-size: cover;
            color: #f2efef;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .menu {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        .menu a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            margin-top: 80px;
        }

        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .product {
            background: rgba(0, 0, 0, 0.7);
            margin: 10px;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }

        .product:hover {
            transform: scale(1.05);
        }

        .product h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }

        .product p {
            font-size: 16px;
            color: #ddd;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
            color: black;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }

        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="menu">
    <a href="/?view=home">Inicio</a>
    <a href="/?view=menu">Menú</a>
    <a href="/?view=reservations">Reservaciones</a>
    <a href="perfil.php">
        <img src="user.png" width="30" height="30">
    </a>
    <a href="cerrar_sesion.php">
        <img src="logout.png" width="30" height="30">
    </a>
</div>

<div class="container">
    <h1>Otros y Extras</h1>
    <div class="product-list">
        <div class="product" data-name="Guacamole" data-price="$50" data-desc="Delicioso guacamole fresco." data-img="guacamole.png">
            <h2>Guacamole</h2>
            <p>$50</p>
        </div>
        <div class="product" data-name="Nachos" data-price="$70" data-desc="Nachos con queso fundido." data-img="nachos.png">
            <h2>Nachos</h2>
            <p>$70</p>
        </div>
        <div class="product" data-name="Queso Fundido" data-price="$80" data-desc="Queso fundido para compartir." data-img="queso.png">
            <h2>Queso Fundido</h2>
            <p>$80</p>
        </div>
    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalName"></h2>
        <img id="modalImg">
        <p id="modalDesc"></p>
        <p id="modalPrice"></p>
    </div>
</div>

<script>
const products = document.querySelectorAll('.product');

products.forEach(item => {
    item.addEventListener('click', () => {
        document.getElementById('modalName').innerText = item.dataset.name;
        document.getElementById('modalImg').src = item.dataset.img;
        document.getElementById('modalDesc').innerText = item.dataset.desc;
        document.getElementById('modalPrice').innerText = item.dataset.price;
        document.getElementById('myModal').style.display = 'block';
    });
});

document.querySelector('.close').onclick = () => {
    document.getElementById('myModal').style.display = 'none';
};

window.onclick = e => {
    if (e.target === document.getElementById('myModal')) {
        document.getElementById('myModal').style.display = 'none';
    }
};
</script>

</body>
