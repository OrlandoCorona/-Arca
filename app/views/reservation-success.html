<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservacion Exitosa</title>
<link rel="stylesheet" href="/assets/css/styles.css">
    <style>
      :root{ --primary:#007bff; --primary-dark:#0056b3; --bg-soft: rgba(255,255,255,0.92); --text-dark:#0b1a2b; }
      body{ font-family: Arial, sans-serif; margin:0; padding:0; background: url('/assets/images/fondoBorroso.jpg') center/cover no-repeat; color:#f2efef; min-height:100vh; display:flex; align-items:center; justify-content:center; }
      .mensaje-flotante{ width:320px; background: linear-gradient(135deg,var(--bg-soft), rgba(240,246,255,0.86)); backdrop-filter: blur(8px); border-radius:12px; padding:22px; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; box-shadow:0 10px 30px rgba(5,20,60,0.12); color:var(--text-dark); }
      .mensaje-flotante p{ margin-bottom:16px; font-size:1rem; }
      .boton-aceptar, .btn-primary{ display:inline-block; padding:10px 22px; background: linear-gradient(180deg,var(--primary),var(--primary-dark)); color:#fff; text-decoration:none; border-radius:8px; box-shadow:0 6px 18px rgba(0,123,255,0.22); transition:transform .12s ease; }
      .boton-aceptar:hover, .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,123,255,0.28); }
      footer.site-footer{ background: linear-gradient(90deg,#071428,#0b1a2b); color:white; text-align:center; padding:12px 0; position:fixed; bottom:0; width:100%; }
    </style>
</head>
<body>

<div class="mensaje-flotante">
    <p>Reserva realizada correctamente. La información ya fue mandada a tu correo electronico</p>
    <a href="/?view=reservations" class="boton-aceptar">Aceptar</a>
</div>

<script src="/assets/js/script.js"></script>

</body>
