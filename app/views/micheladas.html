        body {
            font-family: "Arial", sans-serif;

            background-size: cover;
            color: #f2efef;

        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .menu {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 1;
        }
        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }
        .menu a:hover { text-decoration: underline; }
        h1 { text-align: center; margin-top: 80px; }
        .product-list { display: flex; flex-wrap: wrap; justify-content: center; }
        .product {
            background: rgba(0, 0, 0, 0.7);

            padding: 20px;
            border-radius: 10px;
            width: 200px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }
        .product:hover { transform: scale(1.05); }
        .product h2 { font-size: 20px; margin-bottom: 10px; color: #fff; }
        .product p { font-size: 16px; color: #ddd; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
            color: black;
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover, .close:focus {
            color: black;
            cursor: pointer;
        }
    </style>
</head>

        <!-- productos sin cambios -->

    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalName"></h2>
        <img id="modalImg" style="width:100%">
        <p id="modalDesc"></p>
        <p id="modalPrice"></p>
    </div>
</div>

<script>
document.querySelectorAll('.product').forEach(item => {
    item.addEventListener('click', () => {
        document.getElementById('modalName').innerText = item.getAttribute('data-name');
        document.getElementById('modalImg').src = item.getAttribute('data-img');
        document.getElementById('modalDesc').innerText = item.getAttribute('data-desc');
        document.getElementById('modalPrice').innerText = item.getAttribute('data-price');
        document.getElementById('myModal').style.display = 'block';
    });
});
document.querySelector('.close').onclick = () => {
    document.getElementById('myModal').style.display = 'none';
};
window.onclick = e => {
    if (e.target == document.getElementById('myModal')) {
        document.getElementById('myModal').style.display = 'none';
    }
};
</script>
</body>
