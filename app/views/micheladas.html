<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micheladas - Restaurante-Bar El Arca</title>
<link rel="stylesheet" href="/assets/css/styles.css">
    <style>
      :root{ --primary:#007bff; --primary-dark:#0056b3; --bg-soft: rgba(255,255,255,0.92); --text-dark:#0b1a2b; }
      body{ font-family: Arial, sans-serif; margin:0; padding:0; background: url('/assets/images/fondoBorroso.jpg') center/cover no-repeat; color:#f2efef; }
      .container{ max-width:1200px; margin:0 auto; padding:20px; }
      .menu{ background: linear-gradient(90deg,#071428,#0b1a2b); color:#fff; text-align:center; padding:10px 0; width:100%; position: relative; top:0; z-index:10; }
      .menu a{ color:#fff; text-decoration:none; margin:0 16px; font-size:18px; }
      .menu a:hover{ opacity:0.95; }
      h1{ text-align:center; margin-top:80px; }
      .product-list{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; }
      .product{ background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.35)); margin:10px; padding:20px; border-radius:10px; width:200px; text-align:center; transition:transform 0.25s ease, box-shadow .2s; cursor:pointer; }
      .product:hover{ transform:translateY(-6px); box-shadow:0 8px 24px rgba(3,12,30,0.25); }
      .modal{ display:none; position: relative; inset:0; background: rgba(0,0,0,0.45); align-items:center; justify-content:center; }
      .modal-content{ background: linear-gradient(135deg,var(--bg-soft), rgba(240,246,255,0.86)); backdrop-filter: blur(8px); margin:0 16px; padding:18px; border-radius:12px; width:90%; max-width:520px; text-align:center; }
      .close{ color:#222; font-size:28px; font-weight:bold; float:right; cursor:pointer; }
      .mensaje-flotante{ width:320px; background: linear-gradient(135deg,var(--bg-soft), rgba(240,246,255,0.86)); backdrop-filter: blur(8px); border-radius:12px; padding:22px; text-align:center; box-shadow:0 10px 30px rgba(5,20,60,0.12); color:var(--text-dark); }
      .boton-aceptar, .btn-primary{ display:inline-block; padding:10px 22px; background: linear-gradient(180deg,var(--primary),var(--primary-dark)); color:#fff; text-decoration:none; border-radius:8px; box-shadow:0 6px 18px rgba(0,123,255,0.22); transition:transform .12s ease; }
      footer.site-footer{ background: linear-gradient(90deg,#071428,#0b1a2b); color:white; text-align:center; padding:12px 0; position: relative; bottom:0; width:100%; }
    </style>
</head>
<body>
<div class="menu">
    <a href="/?view=home">Inicio</a>
    <a href="/?view=menu">Menú</a>
    <a href="/?view=reservaciones">Reservaciones</a>
    <a href="/?view=perfil"><img src="/assets/images/user.png" width="30" height="30"></a>
    <a href="/?view=cerrar_sesion"><img src="/assets/images/logout.png" width="30" height="30"></a>
</div>

<div class="container">
    <h1>Micheladas</h1>
    <div class="product-list">
        <!-- productos sin cambios -->
        <!-- … -->
    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalName"></h2>
        <img id="modalImg" style="width:100%">
        <p id="modalDesc"></p>
        <p id="modalPrice"></p>
    </div>
</div>

<script>
document.querySelectorAll('.product').forEach(item => {
    item.addEventListener('click', () => {
        document.getElementById('modalName').innerText = item.getAttribute('data-name');
        document.getElementById('modalImg').src = item.getAttribute('data-img');
        document.getElementById('modalDesc').innerText = item.getAttribute('data-desc');
        document.getElementById('modalPrice').innerText = item.getAttribute('data-price');
        document.getElementById('myModal').style.display = 'block';
    });
});
document.querySelector('.close').onclick = () => {
    document.getElementById('myModal').style.display = 'none';
};
window.onclick = e => {
    if (e.target == document.getElementById('myModal')) {
        document.getElementById('myModal').style.display = 'none';
    }
};
</script>
</body>
</html>
