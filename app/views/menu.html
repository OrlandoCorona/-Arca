<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante-Bar El Arca</title>
<link rel="stylesheet" href="/assets/css/styles.css">
    <style>
      :root{ --primary:#007bff; --primary-dark:#0056b3; --bg-soft: rgba(255,255,255,0.92); --text-dark:#0b1a2b; }
      body{ font-family: Arial, sans-serif; margin:0; padding:0; background: url('/assets/images/fondoBorroso.jpg') center/cover no-repeat; color:#f2efef; }
      .menu{ background: linear-gradient(90deg,#071428,#0b1a2b); color:#fff; text-align:center; padding:10px 0; width:100%; position:fixed; top:0; z-index:20; }
      .menu a{ color:#fff; text-decoration:none; margin:0 16px; font-size:18px; }
      .menu a img{ vertical-align:middle; }
      .menu-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:20px; padding:100px 18px; max-width:1200px; margin:0 auto; }
      .menu-item{ position:relative; overflow:hidden; border-radius:12px; box-shadow:0 8px 20px rgba(3,12,30,0.12); transition:transform .22s ease; }
      .menu-item img{ width:100%; height:auto; display:block; border-radius:12px; }
      .menu-item button{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); padding:10px 20px; font-size:1rem; color:#fff; border:none; border-radius:8px; cursor:pointer; background: rgba(0,0,0,0.45); transition:background .18s, transform .12s; }
      .menu-item:hover{ transform:translateY(-6px); }
      .menu-item button:hover{ transform:translateY(-4px); }
      /* category color helpers (kept for semantics) */
      .desayunos{ background:#f39c12 }
      .comidas-cenas{ background:#c0392b }
      .vips-kids{ background:#8e44ad }
      .milanesas-vips{ background:#f39c12 }
      .clasicos-vips{ background:#e74c3c }
      .menu-dia{ background:#e74c3c }
      footer.site-footer{ background: linear-gradient(90deg,#071428,#0b1a2b); color:white; text-align:center; padding:12px 0; position:fixed; bottom:0; width:100%; z-index:20; }
    </style>
</head>

<body>
    <div class="menu">
        <a href="/?view=home">Inicio</a>
        <a href="/?view=menu">Menú</a>
        <a href="/?view=reservaciones">Reservaciones</a>
        <a href="/?view=perfil">
            <img src="/assets/images/user.png" alt="Avatar de Usuario" width="30" height="30">
        </a>
        <a href="/?view=cerrar_sesion">
            <img src="/assets/images/logout.png" alt="Cerrar sesión" width="30" height="30">
        </a>
    </div>

    <div class="menu-grid">
        <div class="menu-item">
            <img src="/assets/images/cerveza.jpg" alt="Cervezas">
            <button class="desayunos" onclick="location.href='/?view=beers'">CERVEZAS</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/comida.jpg" alt="Comidas y Cenas">
            <button class="comidas-cenas" onclick="location.href='/?view=food'">COMIDA</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/tacos.jpg" alt="Tacos">
            <button class="vips-kids" onclick="location.href='/?view=tacos'">TACOS</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/micheladas.jpg" alt="Micheladas">
            <button class="milanesas-vips" onclick="location.href='/?view=micheladas'">MICHELADAS</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/botellas.jpg" alt="Botellas y Copeo">
            <button class="clasicos-vips" onclick="location.href='/?view=bottles'">BOTELLAS Y COPEO</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/extras.jpg" alt="Extras y Otros">
            <button class="menu-dia" onclick="location.href='/?view=extras'">EXTRAS Y OTROS</button>
        </div>
    </div>

    <footer>
        <p>Restaurante-Bar El Arca &copy; 2024</p>
    </footer>
</body>
</html>
