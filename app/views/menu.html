<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante-Bar El Arca</title>
<link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        body {
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 0;
            background: url("/assets/images/fondoBorroso.jpg") no-repeat center center;
            background-size: cover;
            color: #f2efef;
        }

        .menu {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            position: fixed;
            top: 0;
            z-index: 2;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        .menu a img {
            vertical-align: middle;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .menu-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        .menu-item button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s;
        }

        .menu-item:hover {
            transform: scale(1.05);
        }

        .desayunos { background-color: #f39c12; }

        .comidas-cenas { background-color: #c0392b; }

        .vips-kids { background-color: #8e44ad; }

        .milanesas-vips { background-color: #f39c12; }

        .clasicos-vips { background-color: #e74c3c; }
        
        .menu-dia { background-color: #e74c3c; }

        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 2;
        }
    </style>
</head>

<body>
    <div class="menu">
        <a href="/?view=home">Inicio</a>
        <a href="/?view=menu">Menú</a>
        <a href="/app/controllers/reservaciones.php">Reservaciones</a>
        <a href="/app/controllers/perfil.php">
            <img src="/assets/images/user.png" alt="Avatar de Usuario" width="30" height="30">
        </a>
        <a href="/app/controllers/cerrar_sesion.php">
            <img src="/assets/images/logout.png" alt="Cerrar sesión" width="30" height="30">
        </a>
    </div>

    <div class="menu-grid">
        <div class="menu-item">
            <img src="/assets/images/cerveza.jpg" alt="Cervezas">
            <button class="desayunos" onclick="location.href='/?view=beers'">CERVEZAS</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/comida.jpg" alt="Comidas y Cenas">
            <button class="comidas-cenas" onclick="location.href='/?view=food'">COMIDA</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/tacos.jpg" alt="Tacos">
            <button class="vips-kids" onclick="location.href='/?view=tacos'">TACOS</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/micheladas.jpg" alt="Micheladas">
            <button class="milanesas-vips" onclick="location.href='/?view=micheladas'">MICHELADAS</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/botellas.jpg" alt="Botellas y Copeo">
            <button class="clasicos-vips" onclick="location.href='/?view=bottles'">BOTELLAS Y COPEO</button>
        </div>

        <div class="menu-item">
            <img src="/assets/images/extras.jpg" alt="Extras y Otros">
            <button class="menu-dia" onclick="location.href='/?view=extras'">EXTRAS Y OTROS</button>
        </div>
    </div>

    <footer>
        <p>Restaurante-Bar El Arca &copy; 2024</p>
    </footer>
</body>
</html>
