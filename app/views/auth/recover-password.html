<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña</title>

  <link rel="stylesheet" href="/assets/css/styles.css">

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      padding:0;
      background: url("/assets/images/fondoBorroso.jpg") center/cover no-repeat;
      color:#f2efef;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }

    .header h1{
      font-size:32px;
      font-weight:bold;
      color:black;
      background:white;
      padding:20px;
      border-radius:10px;
      text-align:center;
    }

    .login-btn{
      background:#333;
      color:white;
      border:none;
      padding:10px 20px;
      margin:10px;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }

    .login-btn:hover{ background:#555; }

    footer{
      background:black;
      color:white;
      text-align:center;
      padding:10px 0;
      position:relative;
      bottom:0;
      width:100%;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Recuperar Contraseña</h1>

      <form method="post" action="/?view=recuperar_contrasena">
        <input type="email" name="correo" placeholder="Correo electrónico" required>

        <button type="submit" class="login-btn">
          Recuperar contraseña
        </button>

        <button type="button" class="login-btn" onclick="location.href='/?view=login'">
          Iniciar sesión
        </button>
      </form>
    </div>
  </div>
</body>

<footer>
  <p>
    © 2024 Todos los derechos reservados. Restaurante-Bar El Arca<br>
    <img src="/assets/images/inconoB.jpg" width="30" height="30">
  </p>
</footer>
</html>
