<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña</title>
<link rel="stylesheet" href="/assets/css/styles.css">
    <style>
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: 0;
        background: url("/assets/images/fondoBorroso.jpg") no-repeat center center;
        background-size: cover;
        color: #f2efef;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .container {
        max-width: 1200px;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 36px;
        font-weight: bold;
        color: black;
        background-color: white;
        padding: 20px;
        border-radius: 10px;
      }

      .login-btn {
        background-color: #333;
        color: white;
        border: none;
        padding: 10px 20px;
        margin: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }

      .login-btn:hover {
        background-color: #555;
      }

      footer {
        background-color: black;
        color: white;
        text-align: center;
        padding: 10px 0;
        position: fixed;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <div class="header">
          <div class="card">
            <h1 style="background-color: white; color: black">
              <br />Recuperar Contraseña
            </h1>

            <form
              id="password-recovery-form"
              method="post"
              action="/?view=recuperar_contrasena"
            >
              <input
                type="email"
                name="correo"
                placeholder="Correo electrónico"
                required
              />
              <button
                type="submit"
                class="login-btn"
                id="signup-btn"
                style="background-color: lightslategrey; color:black"
              >
                Recuperar Contrasena
              </button>
              <button
                type="button"
                class="login-btn"
                onclick="location.href='/?view=login'"
              >
                Iniciar Sesión
              </button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </body>
  <footer>
    <p style="background-color: black; color: white; text-align: center">
      © 2024 Todos los derechos reservados. Restaurante-Bar El Arca <br />
      <img src="/assets/images/inconoB.jpg" width="30px" height="30px" alt="Copyright" />
    </p>
  </footer>
</html>
