<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>

  <link rel="stylesheet" href="/assets/css/styles.css">

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      min-height:100vh;
      background: url("/assets/images/fondoBorroso.jpg") center/cover no-repeat;
      display:flex;
      flex-direction:column;
    }

    .page{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      background:white;
      padding:32px;
      border-radius:12px;
      max-width:380px;
      width:100%;
      text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,0.15);
    }

    .card h1{
      color:#000;
      margin-bottom:20px;
    }

    .card input{
      width:100%;
      padding:12px;
      margin-bottom:16px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:16px;
    }

    .login-btn{
      width:100%;
      padding:12px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    .login-btn:hover{
      background:#0056b3;
    }

    footer{
      background:black;
      color:white;
      text-align:center;
      padding:12px 0;
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="card">
      <h1>Recuperar Contraseña</h1>

      <form method="post" action="/?action=recuperar_contrasena">
        <input
          type="email"
          name="correo"
          placeholder="Correo electrónico"
          required
        >

        <button type="submit" class="login-btn">
          Recuperar contraseña
        </button>

        <button
          type="button"
          class="login-btn"
          onclick="location.href='/?view=login'">
          Iniciar sesión
        </button>
      </form>

    </div>
  </div>

  <footer>
    <p>
      © 2024 Todos los derechos reservados. Restaurante-Bar El Arca<br>
      <img src="/assets/images/inconoB.jpg" width="30" height="30">
    </p>
  </footer>

</body>
</html>
