<form id="registration-form" method="post" action="/?view=registro">

  <!-- Correo -->
  <input
    type="email"
    name="correo"
    placeholder="Correo electrónico"
    autocomplete="username"
    required
  />

  <!-- Contraseña -->
  <input
    type="password"
    name="password"
    placeholder="Contraseña"
    autocomplete="new-password"
    required
  />

  <!-- Apellido paterno -->
  <input
    type="text"
    name="apellido_paterno"
    placeholder="Apellido Paterno"
    required
  />

  <!-- Apellido materno -->
  <input
    type="text"
    name="apellido_materno"
    placeholder="Apellido Materno"
    required
  />

  <!-- Teléfono -->
  <input
    type="text"
    name="telefono"
    placeholder="Número de teléfono"
    required
  />

  <!-- Repetir contraseña -->
  <input
    type="password"
    name="repass"
    placeholder="Repetir contraseña"
    required
  />

  <button type="submit" class="login-btn">
    Registrarse
  </button>

</form>
