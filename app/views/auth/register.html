<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Registrar</title>

  <link rel="stylesheet" href="/ElArcaWeb/public/assets/css/styles.css">

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: url("/assets/images/fondoBorroso.jpg") no-repeat center center;
        background-size: cover;
        color: #f2efef;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .mobile-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .login-btn {
        background-color: green;
        color: white;
        border: none;
        padding: 10px 20px;
        margin-top: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }

      .login-btn:hover {
        background-color: darkgreen;
      }

      .other-options {
        text-align: center;
        margin-top: 20px;
      }

      footer {
        background-color: black;
        color: white;
        text-align: center;
        padding: 10px 0;
      }
    </style>
  </head>

  <body>

    <div class="mobile-screen">
      <h1 style="color:black;">Registrar</h1>

      <img
        src="/assets/images/user_avatar.png"
        alt="Avatar de Usuario"
        width="120"
        height="70"
      />

<form method="POST" action="/?=registro">

        <input type="text" name="nombre" placeholder="Nombre" required />
        <input type="email" name="correo" placeholder="Correo electrónico" required />
        <input type="password" name="password" placeholder="Contraseña" required />
        <input type="password" name="password_confirm" placeholder="Repetir contraseña" required />

        <button type="submit" class="login-btn">
          Registrarse
        </button>

      </form>

      <div class="other-options">
        <a href="/?view=login" class="option-text" style="color:black;">
          Iniciar Sesión
        </a>
      </div>
    </div>

    <footer>
      <p>
        © 2024 Todos los derechos reservados. Restaurante-Bar El Arca<br>
        <img src="/assets/images/inconoB.jpg" width="30" height="30">
      </p>
    </footer>

  </body>
</html>
