<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correo Enviado</title>

  <link rel="stylesheet" href="/assets/css/styles.css">

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      min-height:100vh;
      background: url("/assets/images/fondoBorroso.jpg") center/cover no-repeat;
      display:flex;
      flex-direction:column;
    }

    .page{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .mensaje{
      background:white;
      padding:28px;
      border-radius:12px;
      text-align:center;
      max-width:380px;
      box-shadow:0 8px 30px rgba(0,0,0,0.15);
      color:black;
    }

    .boton-aceptar{
      display:inline-block;
      margin-top:16px;
      padding:10px 20px;
      background:#007bff;
      color:white;
      border-radius:6px;
      text-decoration:none;
    }

    footer{
      background:black;
      color:white;
      text-align:center;
      padding:12px 0;
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="mensaje">
      <p>Si el correo existe, recibirás instrucciones para recuperar tu contraseña.</p>
      <a href="/?view=login" class="boton-aceptar">Aceptar</a>
    </div>
  </div>

  <footer>
    <p>
      © 2024 Todos los derechos reservados. Restaurante-Bar El Arca<br>
      <img src="/assets/images/inconoB.jpg" width="30" height="30">
    </p>
  </footer>

</body>
</html>
