<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee4b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102213",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .silver-gradient {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .silver-gradient:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .glass-panel {
            background: rgba(16, 34, 19, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bg-mesh {
            background: radial-gradient(circle at 0% 0%, #1a3c20 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, #0c1a0e 0%, transparent 50%),
                        #102213;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col">
<div class="relative flex min-h-screen w-full flex-col bg-mesh overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center p-4 pb-2 justify-between z-10">
<div class="text-white flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-white/10 cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Acceso Clientes</h2>
</div>
<!-- Hero Branding -->
<div class="flex flex-col items-center pt-8 pb-4">
<div class="w-24 h-24 rounded-full bg-primary/20 flex items-center justify-center mb-6 border border-primary/30">
<span class="material-symbols-outlined text-primary text-5xl">nature_people</span>
</div>
<h2 class="text-white tracking-light text-[28px] font-bold leading-tight px-4 text-center">Bienvenido a El Arca</h2>
<p class="text-white/70 text-base font-normal leading-normal pb-3 pt-1 px-8 text-center max-w-sm">Inicia sesión para vivir una experiencia única en la naturaleza</p>
</div>
<!-- Main Form Container -->
<div class="px-6 flex-1 flex flex-col justify-start">
<div class="glass-panel rounded-xl p-6 shadow-2xl">
<!-- Segmented Control -->
<div class="flex mb-8">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-black/40 p-1 border border-white/5">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-primary/20 has-[:checked]:text-primary text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">Iniciar Sesión</span>
<input checked="" class="invisible w-0" name="auth-mode" type="radio" value="login"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-primary/20 has-[:checked]:text-primary text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">Registrarse</span>
<input class="invisible w-0" name="auth-mode" type="radio" value="register"/>
</label>
</div>
</div>
<!-- Inputs -->
<div class="space-y-5">
<div class="relative">
<label class="block text-xs font-semibold text-primary/80 uppercase tracking-wider mb-1 ml-1">Email</label>
<div class="flex items-center bg-white/5 rounded-lg border border-white/10 focus-within:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-slate-500 ml-3">mail</span>
<input class="w-full bg-transparent border-none text-white focus:ring-0 py-3 px-3 placeholder:text-slate-600" placeholder="tu@email.com" type="email"/>
</div>
</div>
<div class="relative">
<label class="block text-xs font-semibold text-primary/80 uppercase tracking-wider mb-1 ml-1">Contraseña</label>
<div class="flex items-center bg-white/5 rounded-lg border border-white/10 focus-within:border-primary/50 transition-colors">
<span class="material-symbols-outlined text-slate-500 ml-3">lock</span>
<input class="w-full bg-transparent border-none text-white focus:ring-0 py-3 px-3 placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-slate-500 mr-3 cursor-pointer hover:text-white transition-colors">visibility</span>
</div>
</div>
<div class="flex justify-end">
<a class="text-xs text-primary font-medium hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
</div>
<!-- Premium CTA -->
<button class="w-full silver-gradient text-background-dark font-bold text-lg py-4 rounded-lg mt-8 mb-6 flex items-center justify-center gap-2">
                    Ingresar <span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink mx-4 text-slate-500 text-xs font-bold uppercase">O accede con</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4 mt-4">
<button class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 hover:bg-white/10 py-3 rounded-lg transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">

<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-white/5 border border-white/10 hover:bg-white/10 py-3 rounded-lg transition-all">
<svg class="w-5 h-5 fill-white" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.9-3.32 1.91-1.26.02-1.67-.74-3.13-.74-1.47 0-1.92.72-3.11.76-1.28.04-2.48-1.05-3.45-2.01-1.98-1.96-3.5-5.55-1.46-9.05 1.01-1.74 2.82-2.85 4.79-2.88 1.49-.03 2.89 1.01 3.8 1.01.91 0 2.62-1.23 4.41-1.05.75.03 2.85.3 4.2 2.26-3.14 1.83-2.63 6.02.55 7.31-1.12 1.69-2.28 3.38-3.88 4.98zM12.03 7.25c-.21-2.18 1.58-4.22 3.67-4.66.27 2.49-2.11 4.76-3.67 4.66z"></path>
</svg>
<span class="text-sm font-semibold">Apple</span>

</div>
</div>

</div>
</div>
<!-- Footer -->
<div class="p-6 text-center">
<p class="text-slate-500 text-xs">Al continuar, aceptas nuestras <a class="text-primary underline" href="#">Políticas de Privacidad</a> y <a class="text-primary underline" href="#">Términos de Servicio</a></p>
</div>
</div>
